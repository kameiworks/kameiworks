theme = "congo"
title = '会社員小説家の法則—仕事続けながら小説が書けたときの記録'

# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "/"
defaultContentLanguage = "ja"

enableRobotsTXT = true
summaryLength = 100

googleAnalytics = "G-YVE4B0V17G"

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true

